[workspace]
resolver = "2"
members = [
  "crates/vyapaar-ledger",
  "crates/vyapaar-ledger-oms",
  "crates/vyapaar-ledger-portfolio",
  "crates/vyapaar-ledger-journal",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0"
repository = "https://github.com/vyapaar-labs/vyapaar-ledger"

[workspace.dependencies]
vyapaar-core = { path = "../vyapaar-core" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
rust_decimal = "1"
